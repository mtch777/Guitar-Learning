<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <section class="activity-card" aria-label="Practice activity for the last seven days">
        <div
          id="activityTimeline"
          class="activity-timeline"
          aria-label="Practice activity for the last seven days"
        ></div>
      </section>
    </header>

    <section class="category-grid" aria-label="Practice categories">
      <a class="category-card" href="./theory/">
        <span class="category-icon">🧠</span>
        <span class="category-name">Theory</span>
      </a>

      <a class="category-card" href="./sheet-reading/">
        <span class="category-icon">📖</span>
        <span class="category-name">Sheet Reading</span>
      </a>

      <a class="category-card" href="./keyboard-shapes/">
        <span class="category-icon">🎹</span>
        <span class="category-name">Keyboard Shapes</span>
      </a>

      <a class="category-card" href="./learning-songs/">
        <span class="category-icon">🎵</span>
        <span class="category-name">Learning Songs</span>
      </a>

      <a class="category-card" href="./improvisation/">
        <span class="category-icon">✨</span>
        <span class="category-name">Improvisation</span>
      </a>
    </section>

    <p class="storage-note">Practice history is stored on this device.</p>
  </main>

  <script src="./shared/tracker.js"></script>
  <script src="./script.js"></script>
</body>
</html>
