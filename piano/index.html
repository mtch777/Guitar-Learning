<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice</title>
  <link rel="stylesheet" href="./style.css?v=ff2f82fc03cb">
  <meta name="build-version" content="ff2f82fc03cb">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <section class="activity-card" aria-label="Practice activity for the last seven days">
        <div
          id="activityTimeline"
          class="activity-timeline"
          aria-label="Practice activity for the last seven days"
        ></div>
        <p id="activitySyncStatus" class="activity-sync-status" role="status" aria-live="polite"></p>
      </section>
    </header>

    <section class="category-grid" aria-label="Practice categories">
      <a class="category-card" href="./theory/?v=ff2f82fc03cb">
        <span class="category-icon">🧠</span>
        <span class="category-name">Theory</span>
      </a>

      <a class="category-card" href="./keyboard-shapes/?v=ff2f82fc03cb">
        <span class="category-icon">🎹</span>
        <span class="category-name">Keyboard Shapes</span>
      </a>

      <a class="category-card" href="./sheet-reading/?v=ff2f82fc03cb">
        <span class="category-icon">📖</span>
        <span class="category-name">Sheet Reading</span>
      </a>

      <a class="category-card" href="./learning-songs/?v=ff2f82fc03cb">
        <span class="category-icon">🎵</span>
        <span class="category-name">Learning Songs</span>
      </a>

      <a class="category-card" href="./improvisation/?v=ff2f82fc03cb">
        <span class="category-icon">✨</span>
        <span class="category-name">Creativity</span>
      </a>
    </section>
  </main>

  <script src="./shared/tracker.js?v=ff2f82fc03cb"></script>
  <script src="./script.js?v=ff2f82fc03cb"></script>
</body>
</html>
