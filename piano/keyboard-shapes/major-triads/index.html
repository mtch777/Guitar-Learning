<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Major Triads · Practice</title>

<body>
  <main class="lesson-shell">
    <nav class="lesson-nav">
      <a href="../?v=a9f03fff81ea">← Keyboard Shapes</a>
      <a href="../../?v=a9f03fff81ea">Practice home</a>
    </nav>

    <section class="lesson-card">
      <div class="top-row">
        <div class="prompt">
          <span class="prompt-label">Play</span>
          <strong id="rootName">—</strong>
          <span>major triad</span>
        </div>
        <button id="midiButton" class="midi-button" type="button">🔴 Enable MIDI</button>
      </div>

      <div id="status" class="status" aria-live="polite">
        Waiting for keyboard input…
      </div>

      <div class="keyboard-shell">
        <div id="keyboard" class="keyboard" aria-label="Virtual piano keyboard"></div>
      </div>

      <div class="progress-row">
        <span id="progressText">0 / 3</span>
        <div class="answer-actions">
          <button id="answerButton" type="button">Show answer</button>
          <button id="newTriadButton" type="button">New triad</button>
        </div>
      </div>
      <output id="answerText" class="answer-text" hidden aria-live="polite"></output>
    </section>
  </main>

  <script src="../../shared/tracker.js?v=a9f03fff81ea"></script>
