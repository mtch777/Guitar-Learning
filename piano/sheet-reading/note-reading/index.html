<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Note / Chord · Practice</title>
  <link rel="stylesheet" href="./style.css?v=92f0e3900b1b">
  <link rel="stylesheet" href="../../shared/answer.css?v=92f0e3900b1b">
  <meta name="build-version" content="92f0e3900b1b">
</head>
<body ng-app="myApp">
  <div class="lesson-shell">
    <nav class="lesson-nav">
      <a href="../?v=92f0e3900b1b">← Sheet Reading</a>
      <a href="../../?v=92f0e3900b1b">Practice home</a>
    </nav>

    <div class="trainer" ng-controller="MyRngCtrl">
      <h1>{{ lessonTitle }}</h1>

      <div class="filters" ng-show="kind === 'note'">
        <label>
          <span>Clef</span>
          <select ng-model="clefFilter" ng-change="applyFilters()">
            <option value="treble">Treble</option>
            <option value="bass">Bass</option>
            <option value="both">Both</option>
          </select>
        </label>

        <label>
          <span>Notes</span>
          <select ng-model="noteFilter" ng-change="applyFilters()">
            <option value="natural">Natural</option>
            <option value="accidental">Accidental</option>
            <option value="both">Both</option>
          </select>
        </label>
      </div>

      <div class="range-section">
        <div class="range-header">
          <span>Range</span>
          <strong>{{ rangeMinLabel }} – {{ rangeMaxLabel }}</strong>
        </div>

        <div class="dual-range">
          <div class="range-track"></div>
          <div class="range-selection" ng-style="rangeSelectionStyle"></div>

          <input
            id="rangeMin"
            class="range-input"
            type="range"
            min="{{ absoluteMidiMin }}"
            max="{{ absoluteMidiMax }}"
            step="1"
            ng-model="rangeMin"
            ng-change="onRangeMinChange()"
            aria-label="Lowest possible note"
          >

          <input
            id="rangeMax"
            class="range-input"
            type="range"
            min="{{ absoluteMidiMin }}"
            max="{{ absoluteMidiMax }}"
            step="1"
            ng-model="rangeMax"
            ng-change="onRangeMaxChange()"
            aria-label="Highest possible note"
          >
        </div>

        <div class="range-endpoints">
          <span>{{ absoluteMinLabel }}</span>
          <span>{{ absoluteMaxLabel }}</span>
        </div>
      </div>

      <button
        id="midiConnection"
        class="midi-connection"
        ng-class="{ connected: midiConnected }"
        type="button"
        ng-click="enableMIDI()"
      >
        {{ midiConnected ? "🟢 MIDI connected" : "🔴 Enable MIDI" }}
      </button>

      <button id="answerButton" type="button" ng-click="toggleAnswer()" ng-disabled="!answerAvailable">
        {{ answerVisible ? 'Hide answer' : 'Show answer' }}
      </button>
      <output id="answerText" class="answer-text" ng-show="answerVisible" aria-live="polite">
        Answer: {{ answerLabel }}
      </output>

      <button class="restart-round" type="button" ng-show="roundComplete" ng-click="restartRound()">Start new round</button>

      <div class="status" ng-class="statusType" aria-live="polite">
        {{ status }}
      </div>

      <div id="staff"></div>
    </div>
  </div>

  <script src="../../shared/tracker.js?v=92f0e3900b1b"></script>
  <script src="../../shared/midi.js?v=92f0e3900b1b"></script>
  <script>
    if (window.PracticeTracker) {
      window.PracticeTracker.recordOpen("sheet-reading-note-reading");
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/1.2.93/vexflow-min.js"></script>
  <script src="./script.js?v=92f0e3900b1b"></script>
</body>
</html>
