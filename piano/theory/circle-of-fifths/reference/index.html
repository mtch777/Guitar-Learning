<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circle of Fifths Reference</title>
  <link rel="stylesheet" href="./style.css?v=ff2f82fc03cb">
  <meta name="build-version" content="ff2f82fc03cb">
</head>
<body>
  <main class="lesson-shell">
    <nav class="lesson-nav">
      <a href="../?v=ff2f82fc03cb">← Circle of Fifths</a>
      <a href="../../../?v=ff2f82fc03cb">Practice home</a>
    </nav>

    <section class="reference-card">
      <div class="chart-wrap">
        <svg id="circleSvg" viewBox="0 0 640 640" role="img" aria-label="Fully labeled circle of fifths reference"></svg>
      </div>

      <div class="orders">
        <section>
          <h2>Order of sharps</h2>
          <div class="order-line">F♯ → C♯ → G♯ → D♯ → A♯ → E♯ → B♯</div>
        </section>
        <section>
          <h2>Order of flats</h2>
          <div class="order-line">B♭ → E♭ → A♭ → D♭ → G♭ → C♭ → F♭</div>
        </section>
      </div>
    </section>
  </main>

  <script src="../../../shared/tracker.js?v=ff2f82fc03cb"></script>
  <script>
    if (window.PracticeTracker) {
      window.PracticeTracker.recordOpen("theory-circle-of-fifths-reference");
    }
  </script>
  <script src="./script.js?v=ff2f82fc03cb"></script>
</body>
</html>
