<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accidentals Count · Circle of Fifths</title>
  <link rel="stylesheet" href="./style.css?v=98fe48cd3a84">
  <link rel="stylesheet" href="../../../shared/answer.css?v=98fe48cd3a84">
  <meta name="build-version" content="98fe48cd3a84">
</head>
<body>
  <main class="lesson-shell">
    <nav class="lesson-nav">
      <a href="../?v=98fe48cd3a84">← Circle of Fifths</a>
      <a href="../../../?v=98fe48cd3a84">Practice home</a>
    </nav>

    <section class="quiz-card">
      <div class="quiz-toolbar">
        <button id="midiButton" class="midi-button" type="button">🔴 Enable MIDI</button>
        <button id="answerButton" type="button" disabled>Show answer</button>
        <output id="answerText" class="answer-text" hidden aria-live="polite"></output>
        <span id="status" class="status" aria-live="polite">
          Enable MIDI to start
        </span>
      </div>

      <div class="number-keyboard" aria-label="MIDI number mapping">
        <div class="number-key"><span>B</span><strong>0</strong></div>
        <div class="number-key"><span>C</span><strong>1</strong></div>
        <div class="number-key"><span>D</span><strong>2</strong></div>
        <div class="number-key"><span>E</span><strong>3</strong></div>
        <div class="number-key"><span>F</span><strong>4</strong></div>
        <div class="number-key"><span>G</span><strong>5</strong></div>
        <div class="number-key"><span>A</span><strong>6</strong></div>
      </div>

      <div class="chart-wrap">
        <svg
          id="circleSvg"
          viewBox="0 0 600 600"
          aria-label="Circle of fifths accidentals count quiz"
          role="img"
        ></svg>
      </div>

      <button id="restartButton" class="restart-button" type="button" hidden>
        Restart
      </button>
    </section>
  </main>

  <script src="../../../shared/tracker.js?v=98fe48cd3a84"></script>
  <script src="../../../shared/midi.js?v=98fe48cd3a84"></script>
  <script ></script>
  <script>
    if (window.PracticeTracker) {
      window.PracticeTracker.recordOpen("theory-circle-of-fifths-accidentals-count");
    }
  </script>
  <script src="./script.js?v=98fe48cd3a84"></script>
</body>
</html>
