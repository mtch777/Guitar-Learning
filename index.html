<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 String Guitar Trainer</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main class="trainerShell">
    <section class="setupPanel">
      <button id="themeToggle" class="iconButton themeToggleButton floatingThemeToggle" type="button" aria-label="Toggle theme">🌙</button>
      <div class="settingsSection lessonSection">
        <div class="sectionTitle">Lesson</div>
        <div class="controlField lessonField">
        <select id="lessonTypeSelect">
          <option value="intervals">Intervals Relative to Low String</option>
          <option value="nps" selected>2/3 NPS Starting From Interval</option>
        </select>
        </div>
      </div>

      <div class="settingsSection keySection">
        <div class="sectionTitle">Base Key</div>
        <div class="controlField keyField">
        <div class="keyControls">
          <select id="rootSelect" aria-label="Root note">
            <option value="0">C</option><option value="1">C#</option><option value="2">D</option>
            <option value="3" selected>D#</option><option value="4">E</option><option value="5">F</option>
            <option value="6">F#</option><option value="7">G</option><option value="8">G#</option>
            <option value="9">A</option><option value="10">A#</option><option value="11">B</option>
          </select>
          <select id="scaleSelect" aria-label="Scale">
            <option value="ionian">Ionian</option><option value="dorian">Dorian</option>
            <option value="phrygian">Phrygian</option><option value="lydian">Lydian</option>
            <option value="mixolydian">Mixolydian</option><option value="aeolian">Aeolian</option>
            <option value="locrian" selected>Locrian</option>
          </select>
        </div>
        </div>
      </div>

      <div class="settingsSection lessonSettingsSection">
        <div class="sectionTitle">Lesson Settings</div>
        <div id="intervalControlGroup" class="controlField">
        <span class="fieldLabel">Intervals</span>
        <details id="intervalDropdown" class="multiSelect">
          <summary id="intervalSummary">All 7</summary>
          <div id="intervalOptions" class="multiSelectMenu"></div>
        </details>
      </div>

      <div id="npsControls" class="npsControlGrid" hidden>
        <div class="controlField">
          <span class="fieldLabel">Mode</span>
          <details class="multiSelect"><summary id="npsModeSummary">All 7</summary><div id="npsModeOptions" class="multiSelectMenu"></div></details>
        </div>
        <div class="controlField">
          <span class="fieldLabel">Start</span>
          <details class="multiSelect"><summary id="startDegreeSummary">R</summary><div id="startDegreeOptions" class="multiSelectMenu"></div></details>
        </div>
        <div class="controlField directionField">
          <span class="fieldLabel">Direction</span>
          <div id="directionOptions" class="directionSegment" role="radiogroup" aria-label="Direction"></div>
          <span id="directionSummary" hidden></span>
        </div>
      </div>

        <div class="actionRow">
        <div id="orderControl" class="controlField orderField">
          <label for="orderSelect">Order</label>
          <select id="orderSelect"><option value="random" selected>Random</option><option value="ordered">Ordered</option></select>
        </div>
        <div class="actionButtons">
          <button id="showAllButton" class="secondaryButton" type="button">Show all</button>
          <button id="nextButton" class="primaryButton" type="button">Next →</button>
        </div>
      </div>
      </div>
    </section>

    <section class="exercisePanel">
      <div id="answerNote"></div>
      <div id="chartDiv"></div>
    </section>

    <section class="guitarInputPanel">
      <div class="guitarInputIdentity"><span class="guitarIcon">🎸</span><strong>Guitar Input</strong></div>
      <button id="guitarInputButton" class="secondaryButton" type="button">Start</button>
      <span id="guitarInputStatus" class="inputStatus">● Stopped</span>
      <span class="inputMetric">Note <strong id="guitarDetectedNote">—</strong></span>
      <span class="inputMetric">String <strong id="guitarDetectedString">—</strong></span>
      <span id="guitarConfidence" class="inputMetric">Pitch —</span>
    </section>
  </main>

  <script type="module" src="/src/trainer.js"></script>
</body>
</html>
