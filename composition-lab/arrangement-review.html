<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music comparison</title>
<style>
:root{color-scheme:dark;--bg:#0d171d;--card:#182932;--line:#304954;--text:#e8f0f1;--muted:#a3b7bf;--new:#5ce4ba;--old:#ff9bb2;--same:#748c99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:22px 24px 64px}h1{font-size:clamp(24px,3vw,36px);line-height:1.15;margin:3px 0 9px}p{margin:6px 0}.eyebrow,.subtle{color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:.04em}button,select{font:inherit;color:inherit;background:var(--card);border:1px solid #4c6570;border-radius:8px;padding:10px 13px;cursor:pointer;min-height:44px}button:hover,select:hover{border-color:#9ab4bf}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e8c968;outline-offset:3px}button[aria-pressed=true]{background:#254b43;border-color:var(--new)}.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 12px}.versions button{text-align:left;display:flex;gap:10px;align-items:center}.number{display:grid;place-items:center;border:1px solid currentColor;border-radius:100%;min-width:25px;height:25px;font-size:13px}.versions small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.player{position:sticky;top:0;background:var(--bg);z-index:10;padding:10px 0 12px;border-bottom:1px solid var(--line)}audio{width:100%;height:42px;display:block}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.controls label{display:flex;align-items:center;gap:8px}.controls select{padding:6px 9px;font-size:13px}.clock{font-variant-numeric:tabular-nums;color:var(--new);margin-left:auto;font-weight:600}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.swatch{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px}.new{background:var(--new)}.old{border:2px dashed var(--old)}.same{background:var(--same)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.timeline button{padding:8px;font-size:13px;text-align:left}.timeline strong{display:block;font-size:14px}.timeline small{display:block;color:var(--muted)}.timeline button[aria-current=true]{border-color:#e8c968;background:#343423}.roll-layout{display:flex;margin-top:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.axes{width:100px;min-width:100px;background:#17262e}.axis{position:relative;border-bottom:1px solid var(--line)}.axis-title{position:absolute;top:6px;left:8px;right:4px;line-height:1.15;font-size:12px;font-weight:600;overflow-wrap:anywhere}.pitch-label{position:absolute;right:8px;font:11px ui-monospace,monospace;color:var(--muted);transform:translateY(-50%)}.viewport{overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-color:#597581 #14212a;touch-action:pan-x pan-y;flex:1;min-width:0}.roll{position:relative}.roll svg{display:block;overflow:visible}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:2;box-shadow:0 0 5px #ffffff88}.note{cursor:pointer}.note:hover{stroke:#fff;stroke-width:2}.note.active{filter:brightness(1.6);stroke:#fff;stroke-width:2}.details{min-height:27px;margin:10px 0;color:var(--text);font-size:14px}.foot{font-size:12px;color:var(--muted);margin-top:12px}a{color:#8bdfec}.downloads{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}.error{background:#612d38;padding:18px;border-radius:8px}input[type=checkbox]{accent-color:var(--new);width:17px;height:17px}.hint{font-size:12px;color:var(--muted);margin-left:auto}.load{padding:20px;color:var(--muted)}@media(max-width:620px){main{padding:16px 12px 40px}.versions{gap:6px;margin-top:14px}.versions button{display:block;padding:10px 8px;font-size:13px;line-height:1.2}.number{display:none!important}.versions small{font-size:11px;margin-top:6px}.controls{gap:8px;font-size:13px}.controls label{gap:5px}.controls select{max-width:170px}.clock{font-size:12px}.timeline{gap:4px}.timeline button{font-size:11px;padding:7px 5px}.timeline strong{font-size:12px}.axes{width:78px;min-width:78px}.axis-title{font-size:11px}.pitch-label{font-size:10px}.legend{gap:10px;font-size:12px}.hint{display:none}.player{padding-top:6px}.versions small{min-height:26px}}
</style><style>.feedback{border-left:3px solid #89a9b4;padding:5px 12px;margin:12px 0;font-size:14px}.feedback ul{padding-left:18px;margin:4px 0}.feedback li{margin:3px 0}.timeline{grid-template-columns:repeat(auto-fit,minmax(75px,1fr))}</style></head><body><main>
<div id="artist" class="eyebrow">SONGSTERR SCORE PLAYBACK</div><h1 id="title">Music comparison</h1><p id="scope" class="subtle"></p>
<div class="versions" role="group" aria-label="Choose a version"></div>
<p><strong>What changed:</strong> <span id="description">Loading comparison…</span></p>
<div class="feedback"><strong>Feedback I need:</strong><ul id="questions"></ul></div>
<div class="player"><audio id="audio" controls preload="metadata" aria-label="Full-band playback"></audio><div class="controls">
<label>Compare with <select id="compare" aria-label="Compare notes against"></select></label>
<label>Speed <select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option></select></label>
<span id="clock" class="clock"></span></div>
<div class="legend"><span><i class="swatch new"></i>New / changed</span><span><i class="swatch old"></i>Removed / replaced</span><span><i class="swatch same"></i>Unchanged</span></div></div>
<div id="timeline" class="timeline" aria-label="Jump to bars"></div>
<div class="controls"><label><input type="checkbox" id="follow" checked>Follow playback</label><label><input type="checkbox" id="changedOnly">Show only changed parts</label><span id="rollHint" class="hint">Scroll sideways · tap a note for details</span></div>
<div id="details" class="details" aria-live="polite">Tap a note to see its pitch and bar.</div>
<div class="roll-layout"><div id="axes" class="axes"></div><div id="viewport" class="viewport"><div id="roll" class="roll"><div class="load">Loading notes…</div></div></div></div>
<p id="coverage" class="foot"></p><p id="settings" class="foot"></p>
<div class="downloads"></div>
<div id="error" role="alert" hidden></div>
</main><script type="module" src="arrangement-review.mjs"></script></body></html>
