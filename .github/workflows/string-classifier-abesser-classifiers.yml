name: Abeßer classifier comparison

on:
  push:
    paths:
      - ".github/workflows/string-classifier-abesser-classifiers.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.1" pandas scipy librosa scikit-learn soundfile
      - name: Preflight
        run: |
          if grep -nF '\n' training/run_abesser_classifier_comparison.py; then echo "ERROR: literal escaped newline"; exit 1; fi
          python -m py_compile training/run_abesser_reproduction.py training/run_abesser_classifier_comparison.py
          python training/run_abesser_classifier_comparison.py --help >/dev/null
          grep -q -- "--smoke" <(python training/run_abesser_classifier_comparison.py --help)
      - name: Verify dataset
        run: |
          test "$(find training/data/ringing_384 -name '*.wav' | wc -l)" -eq 384
      - name: Smoke test whole cycle
        run: |
          python -u training/run_abesser_classifier_comparison.py training/data/ringing_384 --smoke --order 32 --out training/results/abesser_classifier_smoke
      - name: Print smoke summary
        run: cat training/results/abesser_classifier_smoke/summary.json
      - name: Save smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-abesser-classifier-smoke
          path: training/results/abesser_classifier_smoke

  compare:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.1" pandas scipy librosa scikit-learn soundfile
      - name: Verify dataset
        run: test "$(find training/data/ringing_384 -name '*.wav' | wc -l)" -eq 384
      - name: Run real classifier comparison
        run: |
          python -u training/run_abesser_classifier_comparison.py training/data/ringing_384 --order 32 --out training/results/abesser_classifier_comparison
      - name: Print summary
        run: cat training/results/abesser_classifier_comparison/summary.json
      - name: Save all partial and completed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-abesser-classifier-comparison
          path: training/results/abesser_classifier_comparison
