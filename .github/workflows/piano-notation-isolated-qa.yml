name: Piano notation isolated QA
on:
  push:
    branches: [piano-notation-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Inspect source MIDI without changing production
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, mido
          source=Path('public/piano/learning-songs/uploads/midi-190ee0d516e3917d53b1951bcf08d0577cf9f500819429dad87463c7ee3aba89.mid')
          midi=mido.MidiFile(str(source))
          print('PIANO_SOURCE_BASE64='+base64.b64encode(source.read_bytes()).decode(),flush=True)
          print('PIANO_MIDI_INFO',midi.type,midi.ticks_per_beat,len(midi.tracks),flush=True)
          for i,track in enumerate(midi.tracks):
              print('PIANO_TRACK',i,len(track),track.name,flush=True)
          PY
      - name: Test converter and rebuild in isolated checkout
        run: |
          python -m unittest discover -s tests -p 'test_piano_midi_converter.py'
          python scripts/piano/import-midi-url.py --repair-saved
          npm run prebuild
          node scripts/piano/assert-midi-import.mjs midi-190ee0d516e3917d53b1951bcf08d0577cf9f500819429dad87463c7ee3aba89.musicxml
