name: Step 7 Abeßer feature/model fusion

on:
  push:
    paths:
      - ".github/workflows/string-classifier-abesser-fusion.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn
      - name: Preflight
        run: |
          python -m py_compile training/run_abesser_fusion.py
          python training/run_abesser_fusion.py --help >/dev/null
      - name: Download preserved predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preserved/benchmark preserved/confirmation preserved/abesser
          gh run download 36354714761 -n string-classifier-benchmark -D preserved/benchmark
          gh run download 36361317622 -n string-classifier-time-phase-confirmation -D preserved/confirmation
          gh run download 36374793618 -n string-classifier-abesser-classifiers -D preserved/abesser
          find preserved -type f -print
      - name: Smoke test whole fusion cycle
        run: |
          BASE=$(find preserved/benchmark -path '*benchmark_baseline*leave_one_pitch_out_predictions.csv' | head -1)
          HARM=$(find preserved/benchmark -path '*benchmark_full*leave_one_pitch_out_predictions.csv' | head -1)
          CONF=$(find preserved/confirmation -name confirmation_predictions.csv | head -1)
          AB=$(find preserved/abesser -name predictions_hist_gradient_boosting.csv | head -1)
          test -n "$BASE" && test -n "$HARM" && test -n "$CONF" && test -n "$AB"
          python -u training/run_abesser_fusion.py --baseline "$BASE" --harmonic "$HARM" --confirmation "$CONF" --abesser "$AB" --out training/results/abesser_fusion_smoke --smoke
      - name: Save smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-abesser-fusion-smoke
          path: training/results/abesser_fusion_smoke
          if-no-files-found: warn

  real:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn
      - name: Download preserved predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preserved/benchmark preserved/confirmation preserved/abesser
          gh run download 36354714761 -n string-classifier-benchmark -D preserved/benchmark
          gh run download 36361317622 -n string-classifier-time-phase-confirmation -D preserved/confirmation
          gh run download 36374793618 -n string-classifier-abesser-classifiers -D preserved/abesser
      - name: Real fusion run
        run: |
          BASE=$(find preserved/benchmark -path '*benchmark_baseline*leave_one_pitch_out_predictions.csv' | head -1)
          HARM=$(find preserved/benchmark -path '*benchmark_full*leave_one_pitch_out_predictions.csv' | head -1)
          CONF=$(find preserved/confirmation -name confirmation_predictions.csv | head -1)
          AB=$(find preserved/abesser -name predictions_hist_gradient_boosting.csv | head -1)
          test -n "$BASE" && test -n "$HARM" && test -n "$CONF" && test -n "$AB"
          python -u training/run_abesser_fusion.py --baseline "$BASE" --harmonic "$HARM" --confirmation "$CONF" --abesser "$AB" --out training/results/abesser_fusion
      - name: Print summary
        if: success()
        run: cat training/results/abesser_fusion/summary.json
      - name: Save real outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-abesser-fusion
          path: training/results/abesser_fusion
          if-no-files-found: warn
