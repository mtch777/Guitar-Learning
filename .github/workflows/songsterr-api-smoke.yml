name: Songsterr API connectivity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/songsterr-api-smoke.yml'
  workflow_dispatch:
    inputs:
      include_extras:
        description: "Also probe three optional endpoints"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: DNS, TLS and single-endpoint diagnostics
        shell: bash
        run: |
          mkdir -p songsterr-diagnostics
          python - <<'PY' 2>&1 | tee songsterr-diagnostics/connectivity.txt
          import socket, ssl, urllib.error, urllib.request
          url = "https://www.songsterr.com/api/songs?pattern=Pink+Floyd&size=5"
          host = "www.songsterr.com"
          print("Target:", url, flush=True)
          try:
              ips = sorted({a[4][0] for a in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print("DNS addresses:", ips, flush=True)
          except Exception as e:
              print("DNS ERROR:", repr(e), flush=True)
          try:
              with socket.create_connection((host, 443), timeout=12) as sock:
                  with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as tls:
                      print("TLS version:", tls.version(), flush=True)
                      print("TLS peer:", tls.getpeercert().get("subject"), flush=True)
          except Exception as e:
              print("TLS ERROR:", repr(e), flush=True)
          request = urllib.request.Request(url, headers={"User-Agent": "CompositionLab-Songsterr-Endpoint-SmokeTest/1.0", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=20) as r:
                  print("HTTP status:", r.status, flush=True)
                  print("Content type:", r.headers.get("Content-Type"), flush=True)
                  print("Response sample:", repr(r.read(256).decode("utf-8", "replace")), flush=True)
          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code, e.reason, flush=True)
              print("Content type:", e.headers.get("Content-Type"), flush=True)
              print("Response sample:", repr(e.read(256).decode("utf-8", "replace")), flush=True)
          except Exception as e:
              print("REQUEST ERROR:", repr(e), flush=True)
          PY

      - name: Seven endpoint probes (plus optional extras)
        id: probes
        shell: bash
        env:
          INCLUDE_EXTRAS: ${{ inputs.include_extras }}
        run: |
          args=()
          if [[ "$INCLUDE_EXTRAS" == "true" ]]; then args+=(--include-extras); fi
          set +e
          python composition-lab/songsterr_automation/songsterr_api/test_endpoints.py \
            --artist "Pink Floyd" \
            --output songsterr-diagnostics/songsterr_api_results.json \
            "${args[@]}" 2>&1 | tee songsterr-diagnostics/probes.log
          result=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"

      - name: Inspect modern Songsterr metadata
        shell: bash
        run: |
          python composition-lab/songsterr_automation/songsterr_api/inspect_metadata.py 2>&1 | tee songsterr-diagnostics/inspection.log

      - name: Upload diagnostics even if probes fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songsterr-api-diagnostics
          path: songsterr-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark unsuccessful probes
        if: steps.probes.outputs.exit_code != '0'
        run: |
          echo "::error::One or more Songsterr probes failed. Download the diagnostic artifact for details."
          exit 1
