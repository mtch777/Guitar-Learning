name: Abeßer string-detection reproduction

on:
  push:
    paths:
      - ".github/workflows/string-classifier-abesser.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.1" pandas scipy librosa scikit-learn soundfile
      - name: Verify dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          wavs=list(Path("training/data/ringing_384").glob("*.wav"))
          print("WAV count:",len(wavs),flush=True)
          assert len(wavs)==384
          PY
      - name: Run Abeßer reproduction
        run: |
          python -u training/run_abesser_reproduction.py training/data/ringing_384 \
            --orders 32,48,64 \
            --out training/results/abesser_reproduction
      - name: Print summary
        if: success()
        run: cat training/results/abesser_reproduction/summary.json
      - name: Save all partial and completed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-abesser-reproduction
          path: training/results/abesser_reproduction
          if-no-files-found: warn
