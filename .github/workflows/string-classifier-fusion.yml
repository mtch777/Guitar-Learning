name: String classifier fusion calibration

on:
  push:
    paths:
      - ".github/workflows/string-classifier-fusion.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: pip install numpy pandas scikit-learn
      - name: Download preserved prediction artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preserved/benchmark preserved/confirmation
          gh run download 36354714761 -n string-classifier-benchmark -D preserved/benchmark
          gh run download 36361317622 -n string-classifier-time-phase-confirmation -D preserved/confirmation
          find preserved -type f -print
      - name: Run pitch-separated fusion calibration
        run: |
          BASE=$(find preserved/benchmark -name leave_one_pitch_out_predictions.csv | grep benchmark_baseline | head -1)
          HARM=$(find preserved/benchmark -name leave_one_pitch_out_predictions.csv | grep benchmark_full | head -1)
          CONF=$(find preserved/confirmation -name confirmation_predictions.csv | head -1)
          test -n "$BASE" && test -n "$HARM" && test -n "$CONF"
          python -u training/run_fusion_calibration.py --baseline "$BASE" --harmonic "$HARM" --confirmation "$CONF" --out training/results/fusion_calibration
      - name: Print fusion summary
        if: success()
        run: cat training/results/fusion_calibration/summary.json
      - name: Save fusion outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-fusion-calibration
          path: training/results/fusion_calibration
          if-no-files-found: warn
