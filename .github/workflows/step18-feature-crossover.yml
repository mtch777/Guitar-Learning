name: Step 18 feature crossover

"on":
  push:
    paths:
      - ".github/workflows/step18-feature-crossover.yml"
      - "training/run_step18_feature_crossover.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_then_real:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: pip install numpy pandas scikit-learn xgboost librosa
      - name: Preflight
        run: |
          node --check training/step18_browser_frontend.mjs
          python -m py_compile training/run_step18_feature_crossover.py
      - name: Extract all JS features for the common training pool
        run: node training/step18_browser_frontend.mjs training/data/ringing_384 training/results/step18_crossover_js.json
      - name: Smoke test full four-path cycle on disagreements and controls
        run: python -u training/run_step18_feature_crossover.py training/data/ringing_384 training/results/step18_crossover_js.json --out training/results/step18_crossover_smoke --smoke
      - name: Gate real run on smoke outputs
        run: |
          test -f training/results/step18_crossover_smoke/summary.json
          test -f training/results/step18_crossover_smoke/predictions.csv
          test -f training/results/step18_crossover_smoke/decision_traces.json
      - name: Real run all 384; assert both published baselines
        run: python -u training/run_step18_feature_crossover.py training/data/ringing_384 training/results/step18_crossover_js.json --out training/results/step18_crossover_real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step18-feature-crossover-smoke
          path: training/results/step18_crossover_smoke
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step18-feature-crossover-real
          path: training/results/step18_crossover_real
          if-no-files-found: warn
