name: Step 18 pitch error and tuple impact

"on":
  push:
    paths:
      - ".github/workflows/step18-pitch-impact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_then_real:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: pip install numpy pandas scikit-learn xgboost librosa
      - name: Preflight
        run: |
          node --check training/step18_browser_frontend.mjs
          python -m py_compile training/run_step18_pitch_impact.py
      - name: Extract current JS Stage-A and Stage-B features from all WAVs
        run: node training/step18_browser_frontend.mjs training/data/ringing_384 training/results/step18_pitch_js.json
      - name: Smoke complete Stage-A to tuple cycle on disagreement and controls
        run: python -u training/run_step18_pitch_impact.py training/data/ringing_384 training/results/step18_pitch_js.json --out training/results/step18_pitch_smoke --smoke
      - name: Gate real run on smoke outputs
        run: |
          test -f training/results/step18_pitch_smoke/summary.json
          test -f training/results/step18_pitch_smoke/predictions.csv
          test -f training/results/step18_pitch_smoke/pitch_details.json
      - name: Real run all 384 with baseline assertions
        run: python -u training/run_step18_pitch_impact.py training/data/ringing_384 training/results/step18_pitch_js.json --out training/results/step18_pitch_real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step18-pitch-smoke
          path: training/results/step18_pitch_smoke
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step18-pitch-real
          path: training/results/step18_pitch_real
          if-no-files-found: warn
