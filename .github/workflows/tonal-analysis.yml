name: Songsterr tonal analysis

on:
  push:
    paths:
      - 'tonal-analysis/**'
      - '.github/workflows/tonal-analysis.yml'
  pull_request:
    paths:
      - 'tonal-analysis/**'
      - '.github/workflows/tonal-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run source contracts and tonal behavior regressions
        working-directory: tonal-analysis
        run: python -B -m unittest discover -s tests -v
      - name: Exercise synthetic demo CLI
        run: python -B tonal-analysis/analyze.py examples --output .local/tonal-ci
