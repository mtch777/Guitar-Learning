name: Step 17 final architecture tournament

on:
  push:
    paths:
      - ".github/workflows/string-classifier-final-architecture.yml"
      - "training/run_final_architecture_tournament.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas librosa scikit-learn xgboost joblib
      - name: Preflight
        run: python -m py_compile training/run_final_architecture_tournament.py
      - name: Smoke test complete architecture pipeline
        run: python -u training/run_final_architecture_tournament.py training/data/ringing_384 --out training/results/final_architecture_smoke --smoke
      - name: Validate smoke outputs
        run: |
          test -f training/results/final_architecture_smoke/summary.json
          test -f training/results/final_architecture_smoke/architecture_metrics.csv
          test -f training/results/final_architecture_smoke/architecture_predictions.csv
          test -f training/results/final_architecture_smoke/config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: string-classifier-final-architecture-smoke
          path: training/results/final_architecture_smoke
          if-no-files-found: warn

  real:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas librosa scikit-learn xgboost joblib
      - name: Real final architecture tournament
        run: python -u training/run_final_architecture_tournament.py training/data/ringing_384 --out training/results/final_architecture
      - name: Print result
        run: cat training/results/final_architecture/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: string-classifier-final-architecture
          path: training/results/final_architecture
          if-no-files-found: warn
