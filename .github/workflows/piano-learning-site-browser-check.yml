name: Check Learning Songs in runner Chrome

on:
  push:
    paths:
      - '.github/workflows/piano-learning-site-browser-check.yml'
      - 'scripts/piano/check-learning-site.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser controller
        run: python -m pip install 'playwright==1.56.0'
      - name: Open Learning Songs in Chrome
        run: python scripts/piano/check-learning-site.py
