name: Step 14 calibration personalization

on:
  push:
    paths:
      - ".github/workflows/string-classifier-personalization.yml"
      - "training/run_personalization_experiment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas librosa scikit-learn xgboost
      - name: Preflight
        run: python -m py_compile training/run_personalization_experiment.py
      - name: Smoke test whole personalization pipeline
        run: python -u training/run_personalization_experiment.py --data training/data/ringing_384 --out training/results/personalization_smoke --smoke
      - name: Validate smoke outputs
        run: |
          test -f training/results/personalization_smoke/summary.json
          test -f training/results/personalization_smoke/personalization_predictions.csv
          test -f training/results/personalization_smoke/config.json
      - name: Save smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-personalization-smoke
          path: training/results/personalization_smoke
          if-no-files-found: warn

  real:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas librosa scikit-learn xgboost
      - name: Real personalization experiment
        run: python -u training/run_personalization_experiment.py --data training/data/ringing_384 --out training/results/personalization
      - name: Print result
        run: cat training/results/personalization/summary.json
      - name: Save real outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-classifier-personalization
          path: training/results/personalization
          if-no-files-found: warn
