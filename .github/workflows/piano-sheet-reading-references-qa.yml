name: Sheet Reading references QA

on:
  push:
    branches: [main, piano-all-notes-accidental-spacing]
    paths:
      - 'public/piano/sheet-reading/**'
      - 'public/piano/keyboard-shapes/index.html'
      - 'public/piano/keyboard-shapes/reference/**'
      - 'tests/piano-sheet-reading-references.test.mjs'
      - 'scripts/piano/check-sheet-reading-references.py'
      - '.github/workflows/piano-sheet-reading-references-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and test dependencies
        run: |
          npm ci
          python -m pip install 'playwright==1.56.0'
      - name: Check all pitches, triad categories, and navigation
        run: node --test tests/piano-sheet-reading-references.test.mjs
      - name: Render references on mobile and desktop Chrome
        run: |
          npm run build
          mkdir -p .local/piano-static-site
          ln -s "$(pwd)/dist" .local/piano-static-site/Guitar-Learning
          python -m http.server 8765 --bind 127.0.0.1 --directory .local/piano-static-site >/tmp/piano-reference-http.log 2>&1 &
          python scripts/piano/check-sheet-reading-references.py
      - name: Upload browser reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-reference-screenshots
          path: piano-reference-screenshots/
          if-no-files-found: warn
