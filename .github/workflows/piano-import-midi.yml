name: Import piano MIDI URL

on:
  workflow_dispatch:
    inputs:
      midi_url:
        description: 'Direct HTTPS MIDI URL (not a MuseScore score-page URL)'
        required: true
        type: string
  repository_dispatch:
    types: [piano-midi-import]
  push:
    paths:
      - '.github/workflows/piano-import-midi.yml'
      - 'scripts/piano/import-midi-url.py'
      - 'tests/test_piano_midi_converter.py'
      - 'scripts/piano/build-song-library.mjs'
      - 'public/piano/learning-songs/song-library.seed.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: piano-midi-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install converters and catalog dependencies
        run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Convert direct MIDI URL to MusicXML
        id: convert
        env:
          MIDI_URL: ${{ github.event.client_payload.midi_url || inputs.midi_url }}
          SCORE_TITLE: ${{ github.event.client_payload.title || '' }}
        run: |
          python scripts/piano/import-midi-url.py --url "$MIDI_URL" --title "$SCORE_TITLE"
          npm run prebuild
      - name: Record imported song for automatic selection
        if: github.event_name == 'repository_dispatch'
        env:
          IMPORT_ID: ${{ github.event.client_payload.request_id }}
          SOURCE_FILENAME: ${{ steps.convert.outputs.source_filename }}
        run: node scripts/piano/write-midi-import-receipt.mjs "$IMPORT_ID" "$SOURCE_FILENAME"
      - name: Commit imported MIDI, score and updated library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/piano/learning-songs/uploads/midi-*.mid public/piano/learning-songs/uploads/midi-*.musicxml public/piano/learning-songs/scores/upload-*.musicxml public/piano/learning-songs/song-library.json
          if [ -d public/piano/learning-songs/imports ]; then git add -A public/piano/learning-songs/imports; fi
          if git diff --cached --quiet; then
            echo 'Score already imported.'
          else
            git commit -m 'Import piano MIDI score'
            git push
          fi
      - name: Deploy updated lesson to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
  smoke-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Repair older MIDI imports with mismatched measure grids
        run: |
          python -m unittest discover -s tests -p 'test_piano_midi_converter.py'
          python scripts/piano/import-midi-url.py --repair-saved
          npm run prebuild
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/piano/learning-songs/uploads public/piano/learning-songs/scores public/piano/learning-songs/song-library.json
          if [ -d public/piano/learning-songs/imports ]; then git add -A public/piano/learning-songs/imports; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Repair stored MIDI score measure grids'
            git push
          fi
      - name: Import original MIDI over HTTPS and verify the lesson catalog
        run: |
          python scripts/piano/import-midi-url.py --url 'https://raw.githubusercontent.com/mtch777/Guitar-Learning/main/tests/fixtures/piano-midi-import-smoke.mid'
          npm run prebuild
          node scripts/piano/verify-midi-import-smoke.mjs
