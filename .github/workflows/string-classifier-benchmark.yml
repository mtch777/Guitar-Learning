name: String classifier time-phase experiment

on:
  push:
    paths:
      - ".github/workflows/string-classifier-benchmark.yml"
      - "training/run_time_phase_experiment.py"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.1" pandas scipy librosa scikit-learn xgboost joblib soundfile
      - name: Verify dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("training/data/ringing_384")
          wavs=list(p.glob("*.wav"))
          print("WAV count:", len(wavs))
          print("Bytes:", sum(x.stat().st_size for x in wavs))
          assert len(wavs)==384
          PY
      - name: Run time-phase + feature-family experiment
        run: |
          python training/run_time_phase_experiment.py training/data/ringing_384 \
            --trees 40 \
            --out training/results/time_phase
      - name: Print phase summary
        if: success()
        run: cat training/results/time_phase/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: string-classifier-time-phase
          path: training/results/time_phase
          if-no-files-found: warn
