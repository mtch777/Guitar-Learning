name: Full pipeline live trial browser preflight
"on":
  push:
    paths:
      - ".github/workflows/live-pipeline-preflight.yml"
      - "src/input/gain-calibration.js"
      - "src/input/live-pipeline-engine.js"
      - "src/input/live-guitar.js"
      - "src/input/lesson-worker.js"
      - "src/audio/lesson-microphone.js"
      - "index.html"
      - "src/song-player.js"
      - "tests/fretboard-efficiency-lesson.test.mjs"
      - "training/check_lesson*"
      - "src/input/live-pipeline-test.js"
      - "live-pipeline-test.html"
      - "public/model/gain-reference.json"
      - "training/check_gain_calibration.mjs"
      - "training/check_live_trial_browser.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.51.1 supports this runner; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node training/check_gain_calibration.mjs
      - run: node training/check_lesson_pipeline.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          pip install soundfile numpy
      - name: Verify real AudioWorklet and Worker with synthetic stereo input
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/live_preview.log 2>&1 &
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const url = 'http://127.0.0.1:5173/Guitar-Learning/live-pipeline-test.html';
          const deadline = Date.now() + 30000;
          let ready = false, lastError = 'No HTTP response';
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url, {signal: AbortSignal.timeout(1000)});
              if (response.ok && (await response.text()).includes('<title>Full pipeline live trial</title>')) {
                ready = true;
                break;
              }
              lastError = `HTTP ${response.status} without the expected live trial page`;
            } catch (error) {
              lastError = error.message;
            }
            await new Promise(resolve => setTimeout(resolve, 200));
          }
          if (!ready) {
            console.error(`Preview did not become ready at ${url}: ${lastError}`);
            try { console.error(readFileSync('/tmp/live_preview.log', 'utf8')); }
            catch (error) { console.error(`Could not read preview log: ${error.message}`); }
            process.exit(1);
          }
          console.log('Expected live trial HTTP page is ready.');
          NODE
          node training/check_live_trial_browser.cjs
          node training/check_lesson_browser.cjs
          python - <<'PY'
          import zipfile,json,io,soundfile as sf
          with zipfile.ZipFile('/tmp/live_browser_trial.zip') as z:
              assert z.testzip() is None
              data=json.loads(z.read('results.json'))
              assert data['schema']=='live-pipeline-v1'
              assert len(data['trials'])==2
              assert data['activeGainCalibration']['step']==2
              assert data['activeGainCalibration']['audioCorrection']=='none'
              assert data['trials'][0]['gainCalibration']['step']==2
              cal=json.load(open('/tmp/gain_calibration.json'))['calibrations'][0]
              assert cal['noiseDb']<-100
              assert -18<cal['notes'][0]['peakDb']<-15
              assert cal['notes'][0]['referencePeakDb'] is not None
              tone,silence=data['trials']
              assert tone['target']['positions'][0]['midi']==27
              for route in ['hybrid','correlation']:
                  events=tone['report']['routes'][route]['events']
                  assert events,(route,events)
                  if route=='hybrid':assert events[0]['midi']==51,(route,events)
                  assert not silence['report']['routes'][route]['events']
              for trial in data['trials']:
                  assert not trial['aborted']
                  assert not sum(f['missingCallbacks'] for f in trial['report']['frames'])
                  audio,sr=sf.read(io.BytesIO(z.read(trial['audioFile'])),dtype='float32')
                  assert sr==trial['report']['sampleRate'] and len(audio)==trial['blocks']*4096
              print('Stereo input, acoustic-label separation, silence, timing, ZIP CRC and audio export verified')
          PY
          python training/summarize_live_pipeline.py /tmp/live_browser_trial.zip /tmp/live_browser_trial.zip --out /tmp/live_browser_summary.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/live_browser_summary.json'))['report']
          assert r['trials']==2 and r['invalid_trials']==0
          assert r['routes']['hybrid']['single_first_correct']==0
          assert r['routes']['hybrid']['single_misses']==0
          assert r['routes']['hybrid']['silent_false_events']==0
          print('Analyzer rejects the mismatched target, preserves captures, and deduplicates repeated exports')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pipeline-browser-preflight
          path: |
            /tmp/live_browser_trial.zip
            /tmp/gain_calibration.json
            /tmp/live_pipeline_screen.png
            /tmp/lesson_pipeline_screen.png
            /tmp/live_preview.log
            /tmp/live_browser_summary.json
