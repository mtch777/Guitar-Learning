name: Tiered analysis — Invent Animate, Currents, ERRA

on:
  workflow_dispatch:
    inputs:
      song_ids:
        description: 'Optional comma/space-separated Songsterr IDs; blank runs the full catalog'
        required: false
        type: string
        default: ''
      expected_count:
        description: 'Optional exact selected-ID count; 0 disables this check'
        required: false
        type: number
        default: 0
  workflow_call:
    inputs:
      song_ids:
        description: 'Optional comma/space-separated Songsterr IDs; blank runs the full catalog'
        required: false
        type: string
        default: ''
      expected_count:
        description: 'Optional exact selected-ID count; 0 disables this check'
        required: false
        type: number
        default: 0

permissions:
  contents: write

jobs:
  pilot:
    if: ${{ inputs.song_ids == '' && inputs.expected_count == 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture client
        run: |
          python -m pip install httpx PyGuitarPro==0.11
          git clone --depth 1 https://github.com/6801318d8d/songsterr-dl.git /tmp/songsterr-dl
      - name: Verify Cloud Cascade with existing tiered pipeline
        run: python composition-lab/run_tiered_catalog.py --song-id 460099 --output composition-lab/local-artifacts/catalog-tiered/460099
      - name: Encrypt result with public-only certificate
        if: always()
        run: |
          if test -d composition-lab/local-artifacts/catalog-tiered/460099; then
            tar -czf - -C composition-lab/local-artifacts/catalog-tiered/460099 . | openssl cms -encrypt -binary -aes256 -outform DER -recip composition-lab/tiered-output-public.crt -out tiered-460099.cms
          fi
      - name: Save encrypted pilot and status to draft Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_storage.py upload \
            --tag "tiered-analysis-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --asset-name "tiered-pilot-460099.zip" \
            --file tiered-460099.cms \
            --file composition-lab/local-artifacts/catalog-tiered/460099/status.json

  inventory:
    needs: pilot
    if: ${{ always() && !cancelled() && (needs.pilot.result == 'success' || needs.pilot.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.catalog.outputs.first }}
      second: ${{ steps.catalog.outputs.second }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install httpx PyGuitarPro==0.11
          git clone --depth 1 https://github.com/6801318d8d/songsterr-dl.git /tmp/songsterr-dl
      - name: Freeze catalog and validate requested song selection
        id: catalog
        env:
          SELECTED_SONG_IDS: ${{ inputs.song_ids }}
          EXPECTED_SONG_COUNT: ${{ inputs.expected_count }}
        run: |
          if test -z "$SELECTED_SONG_IDS" && test "$EXPECTED_SONG_COUNT" = "0"; then
            python composition-lab/run_tiered_catalog.py --catalog > catalog.json
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          requested = os.environ.get('SELECTED_SONG_IDS', '')
          expected_text = os.environ.get('EXPECTED_SONG_COUNT', '0')
          if not re.fullmatch(r'\d+', expected_text) or not 0 <= int(expected_text) <= 308:
              raise SystemExit('expected_count must be an integer from 0 through 308')
          expected_count = int(expected_text)
          if requested:
              if not re.fullmatch(r'\s*[1-9]\d*(?:[\s,]+[1-9]\d*)*\s*', requested):
                  raise SystemExit('song_ids must contain positive IDs separated by commas or whitespace')
              ids = [int(value) for value in re.split(r'[\s,]+', requested.strip())]
              if len(ids) != len(set(ids)):
                  raise SystemExit('song_ids contains duplicate IDs')
              if len(ids) > 308:
                  raise SystemExit('song_ids must contain at most 308 IDs')
              if expected_count and len(ids) != expected_count:
                  raise SystemExit(f'Expected {expected_count} selected IDs, received {len(ids)}')
              Path('catalog.json').write_text(json.dumps([{'song_id': song_id} for song_id in ids], indent=2) + '\n')
              mode = 'selected'
              pilot_id = None
              manifest_name = 'tiered-selected-catalog-manifest.zip'
          else:
              if expected_count:
                  raise SystemExit('A nonzero expected_count requires explicit song_ids')
              catalog = json.loads(Path('catalog.json').read_text())
              catalog_ids = [row['song_id'] for row in catalog]
              if len(catalog_ids) != 308 or len(set(catalog_ids)) != 308 or 460099 not in catalog_ids:
                  raise SystemExit('Expected the complete 308-entry catalog including Cloud Cascade')
              ids = [song_id for song_id in catalog_ids if song_id != 460099]
              mode = 'full'
              pilot_id = 460099
              manifest_name = 'tiered-308-catalog-manifest.zip'
          split = (len(ids) + 1) // 2
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('first=' + json.dumps(ids[:split]) + '\n')
              output.write('second=' + json.dumps(ids[split:]) + '\n')
              output.write('manifest_name=' + manifest_name + '\n')
          selection = {
              'mode': mode,
              'pilot_song_id': pilot_id,
              'analysis_song_ids': ids,
              'total_songs_to_process': len(ids) + (pilot_id is not None),
              'expected_count': expected_count,
          }
          Path('selection.json').write_text(json.dumps(selection, indent=2) + '\n')
          print(json.dumps(selection), flush=True)
          PY
      - name: Save catalog manifest to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ASSET: ${{ steps.catalog.outputs.manifest_name }}
        run: |
          python .github/scripts/release_storage.py upload \
            --tag "tiered-analysis-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --asset-name "$MANIFEST_ASSET" \
            --file catalog.json \
            --file selection.json

  analyze-first:
    needs: inventory
    if: ${{ always() && !cancelled() && needs.inventory.result == 'success' && needs.inventory.outputs.first != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        song_id: ${{ fromJSON(needs.inventory.outputs.first) }}
    steps: &song_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install httpx PyGuitarPro==0.11
          git clone --depth 1 https://github.com/6801318d8d/songsterr-dl.git /tmp/songsterr-dl
      - name: Capture, analyze and independently verify
        run: python composition-lab/run_tiered_catalog.py --song-id ${{ matrix.song_id }} --output composition-lab/local-artifacts/catalog-tiered/${{ matrix.song_id }}
      - name: Encrypt private notation and full tiered output
        if: always()
        run: |
          if test -d composition-lab/local-artifacts/catalog-tiered/${{ matrix.song_id }}; then
            tar -czf - -C composition-lab/local-artifacts/catalog-tiered/${{ matrix.song_id }} . | openssl cms -encrypt -binary -aes256 -outform DER -recip composition-lab/tiered-output-public.crt -out tiered-${{ matrix.song_id }}.cms
          fi
      - name: Save encrypted song and status to draft Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SONG_ID: ${{ matrix.song_id }}
        run: |
          python .github/scripts/release_storage.py upload \
            --tag "tiered-analysis-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --asset-name "tiered-song-${SONG_ID}.zip" \
            --file "tiered-${SONG_ID}.cms" \
            --file "composition-lab/local-artifacts/catalog-tiered/${SONG_ID}/status.json"

  analyze-second:
    needs: inventory
    if: ${{ always() && !cancelled() && needs.inventory.result == 'success' && needs.inventory.outputs.second != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        song_id: ${{ fromJSON(needs.inventory.outputs.second) }}
    steps: *song_steps

