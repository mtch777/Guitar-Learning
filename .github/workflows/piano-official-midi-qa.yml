name: Piano official MuseScore MIDI corpus QA

on:
  push:
    paths:
      - '.github/workflows/piano-official-midi-qa.yml'
      - 'scripts/piano/qa-musescore-official-midi.py'
      - 'scripts/piano/verify-midi-fidelity.mjs'
      - 'scripts/piano/expected-midi-attacks.py'
      - 'scripts/piano/assert-midi-import.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-official-midi-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up converter and app
        run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Random MuseScore Studio MIDI exports; require 4 consecutive validated imports
        run: python scripts/piano/qa-musescore-official-midi.py
      - name: Persist QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-official-musescore-midi-results
          path: musescore-official-midi-qa-results.json
          if-no-files-found: warn
