name: Publish isolated regression preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: 3bfe9365b67f2bbfe186f9e386c6ad18bd3513ee

      - name: Fix regression and assert exact source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/song-player.js')
          src = path.read_text()
          broken = 'if (isSoloRakeBeat(beat, barIndex)) continue;'
          fixed = 'if (rakeBeats(voice).has(beat)) continue;'
          assert src.count(broken) == 1, 'Expected broken call not found exactly once'
          src = src.replace(broken, fixed)
          assert 'isSoloRakeBeat(' not in src, 'Stale rake calls remain'
          path.write_text(src)
          print('Patched stale rake call and verified no remaining references')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify patch and existing tests
        run: |
          node --test tests/*.test.mjs
          grep -q 'if (rakeBeats(voice).has(beat)) continue;' src/song-player.js
          ! grep -q 'isSoloRakeBeat(' src/song-player.js

      - name: Build historical preview
        run: npm run build -- --base /Guitar-Learning/versions/3bfe936/

      - name: Update only the same preview URL
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: versions/3bfe936
          keep_files: true
