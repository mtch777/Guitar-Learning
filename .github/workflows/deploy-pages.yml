name: Build and publish GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/riff-builder/**'
      - 'public/piano/**'
      - 'scripts/piano/**'
      - 'public/data/fretboard-efficiency*.json'
      - 'public/fretboard-efficiency/**'
      - 'tests/**'
      - 'index.html'
      - 'riff-builder.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned native player for playback regression checks
        run: npm install --prefix .local/qa --no-save @coderline/alphatab@1.8.4

      - name: Install frozen MIDI parser for fingering checks
        run: python -m pip install -r composition-lab/requirements-fretboard-efficiency.txt

      - name: Verify rake classifier and tests
        run: |
          node --test tests/*.test.mjs
          python -B -m unittest discover -s composition-lab -p 'test_fretboard_*.py'
          python -B -m unittest discover -s composition-lab -p test_riff_browser.py
          python -B -m unittest discover -s composition-lab -p test_riff_pattern_browser.py
          python -B -m unittest discover -s composition-lab -p test_procedural_riff_browser.py
          grep -q 'if (rakeBeats(voice).has(beat)) continue;' src/song-player.js
          ! grep -q 'isSoloRakeBeat(' src/song-player.js

      - name: Build current site
        run: npm run build


      - name: Stamp piano pages with commit cache version
        env:
          CACHE_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape, unescape
          import os
          import re
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          root = Path("dist/piano")
          version = os.environ["CACHE_VERSION"][:12]

          attr_re = re.compile(r'(?P<prefix>\b(?:href|src)=["\'])(?P<url>[^"\']+)(?P<suffix>["\'])')

          def version_url(raw_url):
              url = unescape(raw_url)
              if url.startswith(("http://", "https://", "//", "#", "mailto:", "tel:", "data:", "javascript:")):
                  return raw_url

              parts = urlsplit(url)
              path = parts.path

              should_version = (
                  path.endswith((".js", ".css", ".html"))
                  or path.endswith("/")
                  or path in (".", "..")
              )

              if not should_version:
                  return raw_url

              query = [(key, value) for key, value in parse_qsl(parts.query, keep_blank_values=True) if key != "v"]
              query.append(("v", version))

              return escape(urlunsplit((
                  parts.scheme,
                  parts.netloc,
                  path,
                  urlencode(query),
                  parts.fragment,
              )), quote=True)

          changed = 0

          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8")

              def replace(match):
                  stamped = version_url(match.group("url"))
                  return match.group("prefix") + stamped + match.group("suffix")

              updated = attr_re.sub(replace, text)

              marker = f'<meta name="build-version" content="{version}">'
              if '<meta name="build-version"' in updated:
                  updated = re.sub(
                      r'<meta name="build-version" content="[^"]*">',
                      marker,
                      updated,
                      count=1,
                  )
              elif "</head>" in updated:
                  updated = updated.replace("</head>", f"  {marker}\n</head>", 1)

              if updated != text:
                  html.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Stamped {changed} piano HTML files with cache version {version}")
          PY

      - name: Publish current site without deleting historical previews
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
