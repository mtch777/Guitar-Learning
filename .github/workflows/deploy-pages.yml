name: Build and publish GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify song string mapping
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Checkout last visually working version
        uses: actions/checkout@v4
        with:
          ref: 20439e1cccbad8328a3376439dd27ed0a2df9c6a
          path: _historical

      - name: Build historical preview at its own URL
        run: |
          npm ci --prefix _historical
          npm run build --prefix _historical -- --base /Guitar-Learning/versions/20439e1/
          mkdir -p dist/versions/20439e1
          cp -a _historical/dist/. dist/versions/20439e1/

      - name: Checkout midpoint version
        uses: actions/checkout@v4
        with:
          ref: 59df16ef9d7b336dfc608e771fff5a0dea79ea90
          path: _midpoint

      - name: Build midpoint preview
        run: |
          npm ci --prefix _midpoint
          npm run build --prefix _midpoint -- --base /Guitar-Learning/versions/59df16e/
          mkdir -p dist/versions/59df16e
          cp -a _midpoint/dist/. dist/versions/59df16e/

      - name: Checkout second midpoint
        uses: actions/checkout@v4
        with:
          ref: f8aef277fb0da9cc39ad4aa02e04cb23f61dc182
          path: _midpoint2

      - name: Build second midpoint preview
        run: |
          npm ci --prefix _midpoint2
          npm run build --prefix _midpoint2 -- --base /Guitar-Learning/versions/f8aef27/
          mkdir -p dist/versions/f8aef27
          cp -a _midpoint2/dist/. dist/versions/f8aef27/

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
