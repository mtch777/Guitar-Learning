name: Recover Polite Company MIDI

on:
  push:
    paths:
      - '.github/workflows/piano-recover-polite.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: piano-midi-import
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Reuse original signed MuseScore MIDI from failed import log
        env:
          MIDI_URL: 'https://s3w.musescore.com/musescore.scoredata/g/aac8419eb387ca6bfa397fdfd849711e57d0c671/score.mid?response-content-disposition=inline%3B&response-content-type=audio%2Fmidi&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=B20SANWKGFHTGDNAQBLE%2F20261119%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20261119T232522Z&X-Amz-SignedHeaders=host&X-Amz-Expires=10800&X-Amz-Signature=7486a9328472a497f1dfa99ed75ee70de6565a660a7117443cb70c1b8233b3a5'
        run: |
          python scripts/piano/import-midi-url.py --url "$MIDI_URL" --title 'Polite company - Rainbow Kitten Surprise'
          npm run prebuild
          node --input-type=module -e "
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('public/piano/learning-songs/song-library.json','utf8'));
          const filename='midi-190ee0d516e3917d53b1951bcf08d0577cf9f500819429dad87463c7ee3aba89.musicxml';
          const song=c.songs.find(s=>s.sourceFilename===filename);
          if(!song || !song.attackCount || c.importErrors.length) throw Error('Polite Company is not validated in the lesson catalog: '+JSON.stringify(c.importErrors));
          console.log('Validated Polite Company in song catalog:', song.title, song.attackCount, 'attacks');
          "
      - name: Save imported song
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/piano/learning-songs/uploads public/piano/learning-songs/scores public/piano/learning-songs/song-library.json
          git commit -m 'Import Polite Company by Rainbow Kitten Surprise'
          git push
