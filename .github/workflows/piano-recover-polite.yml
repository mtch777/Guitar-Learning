name: Recover Polite Company MIDI

on:
  push:
    paths:
      - '.github/workflows/piano-recover-polite.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: piano-midi-import
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install 'music21==9.9.1' 'mido==1.3.3'
          npm ci
      - name: Reuse original signed MuseScore MIDI from failed import log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, subprocess, urllib.request
          endpoint = 'https://api.github.com/repos/mtch777/Guitar-Learning/actions/jobs/135959787444/logs'
          request = urllib.request.Request(endpoint, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Guitar-Learning-piano-recovery',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              logs = response.read(1000000).decode('utf-8', 'replace')
          url = next((line.split('MIDI_URL: ', 1)[1].strip() for line in logs.splitlines() if 'MIDI_URL: https://s3w.musescore.com/' in line), None)
          if not url:
              raise RuntimeError('Original MuseScore MIDI link missing from failed import log')
          subprocess.run([
              'python', 'scripts/piano/import-midi-url.py',
              '--url', url,
              '--title', 'Polite company - Rainbow Kitten Surprise',
          ], check=True)
          PY
          npm run prebuild
          node --input-type=module -e "
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('public/piano/learning-songs/song-library.json','utf8'));
          const filename='midi-190ee0d516e3917d53b1951bcf08d0577cf9f500819429dad87463c7ee3aba89.musicxml';
          const song=c.songs.find(s=>s.sourceFilename===filename);
          if(!song || !song.attackCount || c.importErrors.length) throw Error('Polite Company is not validated in the lesson catalog: '+JSON.stringify(c.importErrors));
          console.log('Validated Polite Company in song catalog:', song.title, song.attackCount, 'attacks');
          "
      - name: Save imported song
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/piano/learning-songs/uploads public/piano/learning-songs/scores public/piano/learning-songs/song-library.json
          git commit -m 'Import Polite Company by Rainbow Kitten Surprise'
          git push
