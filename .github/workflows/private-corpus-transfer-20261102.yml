            const owner = context.repo.owner, repo = context.repo.repo;
            const zlib = require('zlib');
            for (let start=0; start<selected.length; start+=32) {
              const batch=selected.slice(start,start+32), rows=[];
              for(let offset=0; offset<batch.length; offset+=8){
                const part=await Promise.all(batch.slice(offset,offset+8).map(async asset=>{
                  const response=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/releases/assets/'+asset.id, {
                    headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/octet-stream','X-GitHub-Api-Version':'2022-11-28'},
                    redirect:'manual'
                  });
                  const location=response.headers.get('location');
                  if(response.body) await response.body.cancel();
                  if(response.status!==302 || !location) throw new Error('Asset '+asset.id+' expected302, got '+response.status);
                  core.setSecret(location);
                  const u=new URL(location);
                  if(u.protocol!=='https:' || !['release-assets.githubusercontent.com','objects.githubusercontent.com'].includes(u.hostname)) throw new Error('Unexpected host');
                  return {...asset,url:location};
                }));
                rows.push(...part);
              }
              const manifest={schema:'private-encrypted-transfer/1',created:new Date().toISOString(),assets:rows};
              const body=JSON.stringify({schema:'private-encrypted-transfer-envelope/1',encoding:'gzip+base64',data:zlib.gzipSync(Buffer.from(JSON.stringify(manifest))).toString('base64')});
              if(body.length>100000) throw new Error('Transfer manifest exceeds bound');
              const number=Math.floor(start/32)+1;
              const release=await github.rest.repos.createRelease({owner,repo,tag_name:'private-corpus-transfer-'+context.runId+'-'+number,target_commitish:context.sha,name:'Temporary private encrypted transfer '+context.runId+' batch '+number,body,draft:true,prerelease:false});
              const check=await github.rest.repos.getRelease({owner,repo,release_id:release.data.id});
              if(!check.data.draft || check.data.body!==body) throw new Error('Draft readback failed');
              core.info('Transfer batch '+number+' ready: draft '+release.data.id+', assets '+rows.length);
            }
