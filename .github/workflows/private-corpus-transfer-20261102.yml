name: Close temporary encrypted transfer handoff

on:
  push:
    branches: ['recovery/finish-six-20261102']
    paths: ['.github/workflows/private-corpus-transfer-20261102.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-transfer:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Close the completed private encrypted transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ids=[432257350,432257339,432257321,432257304,432257286,432257263,432257240,432257219,432257360,432257190,432255182];
            for(const id of ids) {
             const r=await github.rest.repos.getRelease({...context.repo,release_id:id});
             if(!r.data.draft || !r.data.tag_name.startsWith('private-corpus-transfer-')) throw new Error('Unexpected release '+id);
             await github.rest.repos.updateRelease({...context.repo,release_id:id,body:JSON.stringify({schema:'completed-private-transfer/1',status:'encrypted_archives_downloaded_and_sha256_verified_locally',selected_song_archives:308,selected_bytes:9039346749,temporary_download_links_removed:true,decryption_key_uploaded:false,completed_at:new Date().toISOString()}),draft:true});
             core.info('Removed temporary links from draft '+id);
            }
            
